name: Deploy to GitHub Pages

# The site is plain static HTML, CSS, and JS with no build step, so the repo is
# uploaded to Pages as-is. There is no package.json; the previous version of this
# workflow ran `npm ci && npm run build` and published `dist`, which failed on
# every push.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
